<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraCalc — Modern Responsive Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-wrapper">
    <!-- Main Calculator Shell -->
    <main class="calculator-card" id="calculator">
      <!-- Top Bar: App Title & Controls -->
      <header class="calc-header">
        <div class="brand">
          <div class="brand-badge"></div>
          <span class="brand-title">Calculator</span>
        </div>

        <div class="header-actions">
          <!-- Sound Toggle -->
          <button class="icon-btn" id="soundToggleBtn" aria-label="Toggle Sound" title="Toggle Sound Feedback">
            <svg class="sound-icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="sound-icon-off hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- History Toggle -->
          <button class="icon-btn" id="historyToggleBtn" aria-label="Toggle History Panel" title="Calculation History">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="badge" id="historyBadge">0</span>
          </button>

          <!-- Theme Toggle Switch -->
          <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Dark and Light Mode" title="Toggle Theme">
            <div class="toggle-slider">
              <svg class="sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <svg class="moon-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </div>
          </button>
        </div>
      </header>

      <!-- Calculator Display Screen -->
      <section class="display-container">
        <div class="copy-feedback" id="copyFeedback">Copied!</div>
        <div class="expression-row" id="expressionDisplay" title="Current Expression"></div>
        <div class="result-row">
          <span class="result-value" id="resultDisplay" title="Click to copy result">0</span>
          <button class="copy-btn" id="copyResultBtn" aria-label="Copy Result" title="Copy result to clipboard">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- Mode Switcher Tabs: Standard & Scientific -->
      <div class="mode-tabs">
        <button class="tab-btn active" id="standardTab" data-mode="standard">Standard</button>
        <button class="tab-btn" id="scientificTab" data-mode="scientific">Scientific</button>
      </div>

      <!-- Scientific Extra Row (Expanded when in scientific mode) -->
      <div class="scientific-keypad" id="scientificKeypad" aria-hidden="true">
        <button class="btn btn-fn" data-action="sin" title="Sine">sin</button>
        <button class="btn btn-fn" data-action="cos" title="Cosine">cos</button>
        <button class="btn btn-fn" data-action="tan" title="Tangent">tan</button>
        <button class="btn btn-fn" data-action="pi" title="Pi (3.14159...)">π</button>
        <button class="btn btn-fn" data-action="e" title="Euler's constant (2.71828...)">e</button>
        <button class="btn btn-fn" data-action="power" title="x to power y">xʸ</button>
        <button class="btn btn-fn" data-action="square" title="x squared">x²</button>
        <button class="btn btn-fn" data-action="sqrt" title="Square root">√</button>
        <button class="btn btn-fn" data-action="log" title="Logarithm base 10">log</button>
        <button class="btn btn-fn" data-action="ln" title="Natural log">ln</button>
      </div>

      <!-- Keypad Grid -->
      <section class="keypad-grid" role="region" aria-label="Calculator Keypad">
        <!-- Row 1 -->
        <button class="btn btn-danger" data-action="clear" data-key="Escape" title="Clear all (Esc)">AC</button>
        <button class="btn btn-utility" data-action="backspace" data-key="Backspace" title="Backspace (Backspace)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0 2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button class="btn btn-utility" data-action="parentheses" data-key="(" title="Parentheses ()">( )</button>
        <button class="btn btn-operator" data-action="operator" data-value="/" data-key="/" title="Divide (/)">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-num" data-action="number" data-value="7" data-key="7">7</button>
        <button class="btn btn-num" data-action="number" data-value="8" data-key="8">8</button>
        <button class="btn btn-num" data-action="number" data-value="9" data-key="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*" data-key="*" title="Multiply (*)">×</button>

        <!-- Row 3 -->
        <button class="btn btn-num" data-action="number" data-value="4" data-key="4">4</button>
        <button class="btn btn-num" data-action="number" data-value="5" data-key="5">5</button>
        <button class="btn btn-num" data-action="number" data-value="6" data-key="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-" data-key="-" title="Subtract (-)">−</button>

        <!-- Row 4 -->
        <button class="btn btn-num" data-action="number" data-value="1" data-key="1">1</button>
        <button class="btn btn-num" data-action="number" data-value="2" data-key="2">2</button>
        <button class="btn btn-num" data-action="number" data-value="3" data-key="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" data-key="+" title="Add (+)">+</button>

        <!-- Row 5 -->
        <button class="btn btn-utility" data-action="negate" title="Toggle positive/negative">±</button>
        <button class="btn btn-num" data-action="number" data-value="0" data-key="0">0</button>
        <button class="btn btn-num" data-action="decimal" data-key="." title="Decimal point">.</button>
        <button class="btn btn-equals" data-action="calculate" data-key="Enter" title="Calculate (Enter or =)">=</button>
      </section>

      <!-- Keyboard Shortcuts Hint Footer -->
      <footer class="calc-footer">
        <span class="hint-text">💡 Supports full keyboard input • <kbd>Enter</kbd> to solve • <kbd>Esc</kbd> to clear</span> <br> <br>
        <p style="font-size: 11.25px; font-family: Arial;">© 2026 | Developed and Create by Amangupta</p>
      </footer>
    </main>

    <!-- Side History Drawer / Flyout -->
    <aside class="history-drawer" id="historyDrawer" aria-label="Calculation History">
      <div class="history-header">
        <div class="history-title">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>History</span>
        </div>
        <div class="history-actions">
          <button class="clear-history-btn" id="clearHistoryBtn" title="Clear All History">Clear</button>
          <button class="close-history-btn" id="closeHistoryBtn" aria-label="Close History">✕</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history">
          <div class="empty-icon">📭</div>
          <p>No calculations yet</p>
          <span class="empty-sub">Your recent equations will appear here</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
